[workspace]
members = ["sync-service"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["iCloud Albums Sync Contributors"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = "0.7"

# Web framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Cryptography
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"

# Configuration
config = "0.14"
dotenvy = "0.15"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Plist parsing
plist = "1.6"

# iCloud integration via rustpush
# rustpush provides SharedStreams API for automatic album discovery
rustpush = { git = "https://github.com/OpenBubbles/rustpush", features = [] }

# Apple private APIs for authentication
omnisette = { git = "https://github.com/SideStore/apple-private-apis", package = "omnisette" }
icloud-auth = { git = "https://github.com/SideStore/apple-private-apis", package = "icloud-auth" }
